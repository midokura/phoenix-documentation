name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

# GitHub Pages allows a single in-progress deployment, so two pushes landing
# within a build of each other make the later deploy fail with "due to in
# progress deployment". A release does exactly that: it merges the release notes
# PR and then the versioned docs snapshot PR a couple of minutes apart.
#
# Queue the runs rather than cancelling them. Cancelling would be cheaper, but
# release automation watches a specific commit's deploy run and treats a
# cancelled run as a failure.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build website
        run: yarn build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    name: Deploy to Docs website
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          # Pages takes its time on this site. The one deployment that succeeded
          # on 2026-08-06 spent 9m24s in progress, against the action's 10 minute
          # default, so anything marginally slower is cancelled while it is still
          # working. 30 minutes, and the job caps at 45 so a genuinely stuck
          # deployment still ends.
          timeout: 1800000
